name: Auto Update Profile

on:
  # 每天定时更新（UTC 00:30 = 北京时间 08:30）
  schedule:
    - cron: "30 0 * * *"
  # 手动触发
  workflow_dispatch:
  # 推送到 main 分支时触发
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  # ============ 1. 生成贡献蛇图 ============
  generate-snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # GitHub 官方绿格子 + 绿蛇（与整体绿色主题统一）
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23006d32
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2339d353

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
