name: Auto Update Profile

on:
  # 每天定时更新（UTC 00:30 = 北京时间 08:30）
  schedule:
    - cron: "30 0 * * *"
  # 手动触发
  workflow_dispatch:
  # 推送到 main 分支时触发
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  # ============ 1. 生成贡献蛇图 ============
  generate-snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # GitHub 官方绿格子 + 绿蛇（与整体绿色主题统一）
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23006d32
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2339d353

      - name: Commit & Push snake to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update contribution snake"
          git pull --rebase || true
          git push
