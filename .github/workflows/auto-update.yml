name: Auto Update Profile

on:
  # 每天定时更新（UTC 00:30 = 北京时间 08:30）
  schedule:
    - cron: "30 0 * * *"
  # 手动触发
  workflow_dispatch:
  # 推送到 main 分支时触发
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  # ============ 1. 生成贡献蛇图 ============
  generate-snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # GitHub 官方绿格子 + 绿蛇（与整体绿色主题统一）
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23006d32
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2339d353

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============ 3. 生成统计卡（存仓库，不依赖 Vercel，国内可稳定加载） ============
  generate-summary-cards:
    name: Generate profile summary cards
    needs: generate-snake    # 串行推送 main，避免并发 push 冲突
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: chartreuse_dark
          # Action 默认 AUTO_PUSH: true，会自行 commit & push 到 main，
          # 无需再手写 Commit & Push 步骤（此前手写步骤因目录名写错必然失败）
